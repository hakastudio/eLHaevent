<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>eLHa Event : Admin Dashboard</title>
	<script>
		(function () {
			try {
				sessionStorage.setItem('elha_admin_route', '1');
				sessionStorage.setItem('elha_admin_unlocked', '1');
			} catch (e) {}
			var rootPath = window.location.pathname.replace(/\/adminelha\/?(index\.html)?$/i, '/');
			if (!rootPath) rootPath = '/';
			var glue = rootPath.indexOf('?') === -1 ? '?' : '&';
			window.location.replace(rootPath + glue + 'admin=1');
		})();
	</script>
</head>
<body></body>
</html>
